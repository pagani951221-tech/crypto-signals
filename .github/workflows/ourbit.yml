name: 更新 Ourbit 幣種清單

on:
  schedule:
    - cron: '30 1 * * 1' # 每週一 UTC 01:30＝台灣 09:30
  workflow_dispatch:

permissions:
  contents: write # 要把更新後的 ourbit.json 提交回倉庫

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node update-ourbit.js
      - name: 有變動才提交
        run: |
          git diff --quiet ourbit.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Ourbit coin list"
          git push
